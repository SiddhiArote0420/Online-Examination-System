<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register Student</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
body {
    background: #f8fafc;
    font-family: 'Plus Jakarta Sans', sans-serif;
    padding: 24px;
    color: #0f172a;
}
.reg-card {
    max-width: 600px;
    margin: 10px auto;
    background: #ffffff;
    border-radius: 18px;
    padding: 32px;
    border: 1px solid #e2e8f0;
    box-shadow: 0 10px 30px rgba(15, 23, 42, 0.05);
}
.card-header-box {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 14px;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid #f1f5f9;
}
.header-icon {
    width: 46px;
    height: 46px;
    border-radius: 12px;
    background: #eff6ff;
    color: #2563eb;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
}
.form-label {
    font-weight: 600;
    font-size: 13.5px;
    color: #334155;
    margin-bottom: 6px;
}
.form-control {
    border-radius: 10px;
    padding: 10px 14px;
    border: 1px solid #cbd5e1;
    font-size: 14px;
}
.form-control:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
}
.btn-submit {
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    color: #ffffff;
    border: none;
    padding: 12px 20px;
    border-radius: 10px;
    font-weight: 700;
    width: 100%;
    transition: 0.2s;
}
.btn-submit:hover {
    opacity: 0.95;
    color: #fff;
}
</style>
</head>
<body>

<div class="reg-card">
    <div class="card-header-box">
        <div class="d-flex align-items-center gap-3">
            <div class="header-icon"><i class="bi bi-person-plus-fill"></i></div>
            <div>
                <h4 class="fw-bold m-0">Add New Student</h4>
                <span class="text-muted small">Fill in student details below to create an account</span>
            </div>
        </div>
        <a href="viewStudents" class="btn btn-outline-secondary btn-sm fw-semibold">
            <i class="bi bi-arrow-left me-1"></i> Back
        </a>
    </div>

    <div id="alertBox"></div>

    <form action="register" method="post" onsubmit="return validateForm()">
        <div class="mb-3">
            <label class="form-label">Student Full Name</label>
            <input type="text" name="studentName" class="form-control" placeholder="Enter full name" required>
        </div>

        <div class="row g-3 mb-3">
            <div class="col-sm-6">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="student@example.com" required>
            </div>
            <div class="col-sm-6">
                <label class="form-label">Mobile Number</label>
                <input type="tel" name="mobile" maxlength="10" pattern="[0-9]{10}" class="form-control" placeholder="10-digit mobile number" required>
            </div>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-sm-6">
                <label class="form-label">Course</label>
                <input type="text" name="course" class="form-control" placeholder="e.g., B.E. / BCA / MCA" required>
            </div>
            <div class="col-sm-6">
                <label class="form-label">Password</label>
                <input type="password" name="password" minlength="6" class="form-control" placeholder="Min. 6 characters" required>
            </div>
        </div>

        <button class="btn-submit" type="submit">
            <i class="bi bi-check2-circle me-1"></i> Save Student
        </button>
    </form>
</div>

<script>
const params = new URLSearchParams(window.location.search);
if (params.get('msg') === 'Success') {
    document.getElementById('alertBox').innerHTML = '<div class="alert alert-success py-2 small fw-semibold"><i class="bi bi-check-circle-fill me-1"></i> Student added successfully! <a href="viewStudents" class="ms-2 fw-bold">View List</a></div>';
} else if (params.get('msg') === 'Failed') {
    document.getElementById('alertBox').innerHTML = '<div class="alert alert-danger py-2 small fw-semibold"><i class="bi bi-exclamation-triangle-fill me-1"></i> Registration failed. Email may already exist.</div>';
}
</script>
<script src="JS/registration.js"></script>
</body>
</html>
