<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link rel="stylesheet" href="CSS/Registration.css" />
</head>
<body>
	<div class="container">

		<div class="right">

			<h2>Create Account</h2>
			<p>Fill in the details below to register</p>

			<form action="register" method="post"
				onsubmit="return validateForm()">

				

				<div class="input-box">
					<label>Student Name</label> <input type="text" name="studentName"
						placeholder="Enter full name" required>
				</div>

				<div class="input-box">
					<label>Email</label> <input type="email" name="email"
						placeholder="Enter email" required>
				</div>

				<div class="input-box">
					<label>Mobile</label> <input type="tel" name="mobile"
						maxlength="10" pattern="[0-9]{10}"
						placeholder="Enter mobile number" required>
				</div>

				<div class="input-box">
					<label>Course</label> <input type="text" name="course"
						placeholder="Enter course" required>
				</div>

				<div class="input-box">
					<label>Password</label> <input type="password" name="password"
						minlength="6" placeholder="Create password" required>
				</div>

				<button class="btn" type="submit">Create Account</button>
			</form>

		</div>


	</div>

	<script src="JS/registration.js"></script>
</body>
</html>
