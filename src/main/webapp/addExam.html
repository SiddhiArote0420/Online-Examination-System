<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Exam</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<style>
body {
    background: #f8fafc;
    font-family: 'Plus Jakarta Sans', sans-serif;
    padding: 28px;
    color: #0f172a;
}
.form-card {
    max-width: 640px;
    margin: 10px auto;
    background: #ffffff;
    border-radius: 18px;
    padding: 32px;
    border: 1px solid #e2e8f0;
    box-shadow: 0 10px 30px rgba(15, 23, 42, 0.05);
}
.card-header-box {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 14px;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid #f1f5f9;
}
.header-icon {
    width: 46px;
    height: 46px;
    border-radius: 12px;
    background: #eff6ff;
    color: #2563eb;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
}
.form-label {
    font-weight: 600;
    font-size: 13.5px;
    color: #334155;
    margin-bottom: 6px;
}
.form-control {
    border-radius: 10px;
    padding: 10px 14px;
    border: 1px solid #cbd5e1;
    font-size: 14px;
}
.form-control:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
}
.btn-submit {
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    color: #fff;
    border: none;
    padding: 12px 20px;
    border-radius: 10px;
    font-weight: 700;
    width: 100%;
    transition: all 0.2s ease;
}
.btn-submit:hover {
    opacity: 0.95;
    transform: translateY(-1px);
    color: #fff;
}
@media (max-width: 576px) {
    body {
        padding: 12px;
    }
    .form-card {
        padding: 20px 16px;
        border-radius: 14px;
    }
    .card-header-box {
        flex-wrap: wrap;
    }
}
</style>
</head>
<body>

<div class="form-card">
    <div class="card-header-box">
        <div class="d-flex align-items-center gap-3">
            <div class="header-icon"><i class="bi bi-journal-plus"></i></div>
            <div>
                <h4 class="fw-bold m-0">Add New Exam</h4>
                <span class="text-muted small">Configure exam details, marks, and duration</span>
            </div>
        </div>
        <a href="viewExam" class="btn btn-outline-secondary btn-sm fw-semibold">
            <i class="bi bi-arrow-left me-1"></i> Back
        </a>
    </div>

    <div id="alertBox"></div>

    <form action="addExam" method="post">
        <div class="mb-3">
            <label class="form-label">Exam Title</label>
            <input type="text" name="examName" class="form-control" placeholder="e.g., Java Core Mid-Term Assessment" required>
        </div>

        <div class="row g-3 mb-3">
            <div class="col-sm-6">
                <label class="form-label">Subject ID</label>
                <input type="number" name="subjectId" class="form-control" placeholder="Enter Subject ID" required>
            </div>
            <div class="col-sm-6">
                <label class="form-label">Total Questions</label>
                <input type="number" name="totalQuestions" class="form-control" placeholder="e.g., 20" required>
            </div>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-sm-6">
                <label class="form-label">Total Marks</label>
                <input type="number" name="totalMarks" class="form-control" placeholder="e.g., 100" required>
            </div>
            <div class="col-sm-6">
                <label class="form-label">Duration (Minutes)</label>
                <input type="number" name="examDuration" class="form-control" placeholder="e.g., 30" required>
            </div>
        </div>

        <button type="submit" class="btn-submit">
            <i class="bi bi-check2-circle me-1"></i> Save Exam
        </button>
    </form>
</div>

<script>
const params = new URLSearchParams(window.location.search);
if (params.get('msg') === 'success') {
    document.getElementById('alertBox').innerHTML = '<div class="alert alert-success py-2 small fw-semibold"><i class="bi bi-check-circle-fill me-1"></i> Exam added successfully! <a href="viewExam" class="ms-2 fw-bold">View List</a></div>';
} else if (params.get('msg') === 'fail') {
    document.getElementById('alertBox').innerHTML = '<div class="alert alert-danger py-2 small fw-semibold"><i class="bi bi-exclamation-triangle-fill me-1"></i> Failed to add exam. Please check Subject ID.</div>';
}
</script>
</body>
</html>
